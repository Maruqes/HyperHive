syntax = "proto3";

package extra;

option go_package = "github.com/Maruqes/512SvMan/api/proto/extra;proto";

enum WebSocketsMessageType {
  reserved 3, 5;
  reserved "ContainerLogs", "DockerCompose";
  DownloadIso = 0;
  MigrateVm = 1;
  BackUpVM = 2;
  Logs = 4;
  VMInfo = 6;
  Error = 7;
  RevertVM = 8;
}

message WebsocketMessage {
  WebSocketsMessageType type = 1;
  string message = 2;
  string extra = 3;
}
message Empty {}

message UpdateInfo {
  string name = 1;
  string version = 2;
}

message AllUpdates { repeated UpdateInfo updates = 1; }

message UpdateRequest {
  string name = 1; // if empty means all
  bool restartAfter = 2;
}

enum NotificationSeverity {
  SEVERITY_UNSPECIFIED = 0; // older slaves: master derives severity from critical
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_CRITICAL = 4;
}

message Notification {
  string title = 1;
  string body = 2;
  string relURL = 3;
  bool critical = 4; // kept for older masters; true when severity >= error
  NotificationSeverity severity = 5;
  string event = 6;     // stable key, e.g. "health.smart"
  string dedup_key = 7; // repeated notifications with the same key are suppressed
  string machine = 8;
}

message RestartShutdownNow { bool now = 1; }

message SparsifyQcow2Request { string diskPath = 1; }

// PowerScheduleRequest replaces the host's HH power-off job. When enabled, the host
// runs `rtcwake -u -m off -t wake_unix` at stop_unix. When disabled, HH jobs are
// removed and the RTC alarm is cleared. Epochs are UTC seconds.
message PowerScheduleRequest {
  bool enabled = 1;
  int64 stop_unix = 2;
  int64 wake_unix = 3;
}

message PowerScheduleResult {
  string job_id = 1; // empty when disabled
  int64 stop_unix = 2;
  int64 wake_unix = 3;
}

// master service
service ExtraService {
  // master
  rpc SendWebsocketMessage(WebsocketMessage) returns (Empty);

  // master
  rpc CheckForUpdates(Empty) returns (AllUpdates);
  rpc PerformUpdate(UpdateRequest) returns (Empty);

  rpc SendNotifications(Notification) returns (Empty);
  
  rpc ShutDown(RestartShutdownNow)returns(Empty);
  rpc Restart(RestartShutdownNow)returns(Empty);
  rpc SparsifyQcow2(SparsifyQcow2Request)returns(Empty);
  rpc ApplyPowerSchedule(PowerScheduleRequest) returns (PowerScheduleResult);
}
