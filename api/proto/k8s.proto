syntax = "proto3";

package k8s;

option go_package = "github.com/Maruqes/512SvMan/api/proto/k8s;proto";

message Empty {}
message Token {
  string token = 1;
  string nodeIp = 2;
}

message ConnectionToCluster {
  string serverIp = 2;
  string token = 3;
}

message ConnectionFile { string file = 1; }

message IsMasterSlaveRes { bool weAreMasterSlave = 1; }

message ConnectionFileIp { string ip = 1; }

message TLSSANSIps { repeated string ips = 1; }

message ClusterStatus {
  bool connected = 1;
  string nodeIp = 2;
  string serverUrl = 3;
  string error = 4;
}

message K8sNode {
  string name = 1;
  repeated string addresses = 2;
  bool ready = 3;
}

message K8sServicePort {
  string name = 1;
  int32 port = 2;
  int32 node_port = 3;
  string protocol = 4;
}

message K8sServiceInfo {
  string namespace = 1;
  string name = 2;
  string type = 3;
  string cluster_ip = 4;
  repeated string load_balancer_ips = 5;
  repeated K8sServicePort ports = 6;
}

message K8sIngressRule {
  string host = 1;
  string path = 2;
  string service = 3;
  int32 port = 4;
}

message K8sIngress {
  string namespace = 1;
  string name = 2;
  repeated K8sIngressRule rules = 3;
}

message ClusterResources {
  bool available = 1;
  repeated K8sNode nodes = 2;
  repeated K8sServiceInfo services = 3;
  repeated K8sIngress ingresses = 4;
}

// its youu that i lie with
service K8sService {
  rpc GetToken(Empty) returns (Token);
  rpc GetConnectionFile(ConnectionFileIp) returns (ConnectionFile);
  rpc GetTLSSANIps(Empty) returns (TLSSANSIps);
  rpc GetClusterStatus(Empty) returns (ClusterStatus);
  rpc SetConnectionToCluster(ConnectionToCluster) returns (Empty);
  rpc IsMasterSlave(Empty) returns (IsMasterSlaveRes);
  rpc GetClusterResources(Empty) returns (ClusterResources);
}
